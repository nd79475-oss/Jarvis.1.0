<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efd2ab"><meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<style>
:root{--bg:#efd2ab;--pn:#ffe4c4;--ln:#d9b48a;--tx:#3a1a14;--dm:#7a5a45;--acc:#9e1b32;--red:#9e1b32;--glass:rgba(255,238,214,.78)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#d6ad7e transparent}html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(900px 650px at 28% 18%,#fff3e0,transparent 62%),radial-gradient(800px 700px at 78% 88%,#f3c79c,transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 Georgia,"Times New Roman",serif}
canvas{display:block}button{font-family:inherit}
h3{margin:0 0 10px;font:600 11px Georgia,serif;letter-spacing:.28em;color:var(--acc);text-transform:uppercase;flex:none}
#orbbox{position:fixed;inset:0;overflow:hidden}
#orbbox::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-6%;height:48%;background:repeating-linear-gradient(90deg,#9e1b3222 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,#9e1b3222 0 1px,transparent 1px 64px);transform:perspective(520px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}#lines{display:none}
#logo{position:absolute;left:28px;top:22px;font:600 20px Georgia,serif;letter-spacing:.45em;color:var(--acc)}
#logo small{display:block;font:400 10px Georgia,serif;letter-spacing:.3em;color:var(--dm);margin-top:2px;text-transform:uppercase}
#nodes{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:10px;min-width:142px;border:1px solid #d6ad7e;color:var(--tx);background:linear-gradient(#fff7ea,#ffe2c0);border-radius:14px;padding:10px 16px;font:600 10.5px Georgia,serif;letter-spacing:.22em;cursor:pointer;transition:.15s;box-shadow:0 4px 0 #d0a272,0 12px 20px -8px rgba(58,26,20,.4)}
.node i{font-style:normal;font-size:14px;color:var(--acc);letter-spacing:0;width:16px;text-align:center}
.node:hover{transform:translateY(-2px);box-shadow:0 6px 0 #d0a272,0 16px 24px -8px rgba(58,26,20,.4)}
.node:active{transform:translateY(3px);box-shadow:0 1px 0 #d0a272,0 4px 8px -4px rgba(58,26,20,.4)}
.node.on{background:linear-gradient(#b8233d,#8f152a);border-color:#7a1226;color:#fff1de;box-shadow:0 4px 0 #6a0f20,0 14px 24px -8px rgba(158,27,50,.65)}.node.on i{color:#ffd9b8}
#hud{position:absolute;left:0;right:420px;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:10px}
#status{font-size:11px;letter-spacing:.38em;color:var(--acc)}#wv{width:220px;height:28px}#acts{display:flex;gap:12px}
#vm,#term{border-radius:30px;padding:12px 24px;font:700 10.5px Georgia,serif;letter-spacing:.24em;cursor:pointer;transition:.15s}
#vm{border:1px solid #7a1226;color:#fff1de;background:linear-gradient(#b8233d,#8f152a);box-shadow:0 4px 0 #6a0f20,0 12px 20px -8px rgba(158,27,50,.6)}
#term{border:1px solid #d6ad7e;color:var(--acc);background:linear-gradient(#fff7ea,#ffe2c0);box-shadow:0 4px 0 #d0a272,0 12px 20px -8px rgba(58,26,20,.35)}
#vm:hover,#term:hover{transform:translateY(-2px)}#vm:active,#term:active{transform:translateY(3px)}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;width:min(90%,640px);text-align:center;font-size:17px;max-height:26%;overflow:auto;display:none}
.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.65);border-radius:24px;padding:18px;display:flex;flex-direction:column;min-height:0;box-shadow:0 34px 60px -28px rgba(110,25,40,.45),0 8px 18px rgba(58,26,20,.1),inset 0 1px 0 rgba(255,255,255,.8)}
#chat{position:fixed;right:20px;top:20px;bottom:20px;width:380px;z-index:10}
#panel{position:fixed;left:calc(50% - 100px);top:50%;width:min(560px,92vw);max-height:72vh;transform:translate(-50%,-46%) scale(.95);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#pclose{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid #d6ad7e;background:linear-gradient(#fff7ea,#ffe2c0);color:var(--acc);cursor:pointer;box-shadow:0 3px 0 #d0a272}
#pclose:active{transform:translateY(2px);box-shadow:0 1px 0 #d0a272}
#pbody{overflow:auto;font-size:14px;flex:1;padding-right:4px}#pbody label{display:block;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.row>span{color:var(--dm);min-width:70px}
select,#pbody input:not([type=checkbox]):not([type=range]),#inp{background:rgba(255,247,234,.92);color:var(--tx);border:1px solid #e3c39a;border-radius:12px;padding:9px 11px;font:inherit;min-width:0;flex:1}
select:focus,#pbody input:focus,#inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #9e1b3222}
select option{background:#fff1de}input[type=range],input[type=checkbox]{accent-color:var(--acc)}
.sm,.chip,.applink{background:linear-gradient(#fff7ea,#ffe2c0);border:1px solid #d6ad7e;color:var(--acc);border-radius:20px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;box-shadow:0 3px 0 #d0a272}
.sm{padding:7px 14px;font-size:10.5px;letter-spacing:.14em}.chip{white-space:nowrap;padding:6px 13px;font-size:12px}
.applink{display:inline-block;padding:7px 14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.sm:hover,.chip:hover,.applink:hover{transform:translateY(-1px)}.sm:active,.chip:active,.applink:active{transform:translateY(2px);box-shadow:0 1px 0 #d0a272}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #0000;cursor:pointer;transition:.15s;box-shadow:0 3px 6px rgba(58,26,20,.3)}.sw:hover{transform:scale(1.15)}.sw.on{border-color:#3a1a14}
.mem{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e3c39a}.mem b{cursor:pointer;color:var(--red)}
#map,#off{width:100%;height:120px;border:1px solid #e3c39a;border-radius:14px;background:#fff3e2aa;margin-bottom:12px}#off{image-rendering:pixelated}
#feed{max-height:140px;overflow:auto;font-size:12px;color:var(--dm)}#feed div{padding:4px 0;border-bottom:1px solid #e3c39a}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.m{padding:10px 14px;border-radius:16px;max-width:90%;word-wrap:break-word;box-shadow:0 8px 16px -10px rgba(58,26,20,.5)}
.u{align-self:flex-end;background:linear-gradient(#fadab4,#f2c18e);border-radius:16px 16px 4px 16px}
.a{align-self:flex-start;background:rgba(255,251,244,.95);border:1px solid #ecd0ac;border-radius:16px 16px 16px 4px}
.m code{background:#00000014;padding:1px 5px;border-radius:5px}.typing{opacity:.6;font-style:italic}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 8px;flex:none}
#bar{display:flex;gap:8px;flex:none}
.btn{background:linear-gradient(#b8233d,#8f152a);color:#fff1de;border:1px solid #7a1226;border-radius:14px;padding:0 16px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 3px 0 #6a0f20}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6a0f20}
#mic.rec{background:linear-gradient(#d33a52,#b0243a)}
#orbbox.full{z-index:50}#orbbox.full #nodes,#orbbox.full #vm,#orbbox.full #logo{display:none}#orbbox.full ~ #chat,#orbbox.full ~ #panel{display:none}
#orbbox.full #hud{right:0;bottom:40px}#orbbox.full #cap{display:block}
@media(max-width:900px){#logo{left:18px;top:14px;font-size:17px}
#nodes{left:0;right:0;top:54px;transform:none;flex-direction:row;overflow-x:auto;padding:6px 14px 14px;gap:9px}
.node{min-width:0;padding:9px 13px;white-space:nowrap;flex:none;letter-spacing:.14em}
#hud{right:0;bottom:calc(46vh + 10px);gap:8px}#wv{display:none}
#chat{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;border-radius:26px 26px 0 0;padding:14px}
#panel{left:50%;max-height:62vh}#orbbox.full #hud{bottom:40px}}
</style></head><body>
<div id="orbbox"><canvas id="cv"></canvas><svg id="lines"></svg>
 <div id="logo">JARVIS<small>personal assistant</small></div>
 <div id="nodes"><button class="node" data-k="memory"><i>◈</i>MEMORY</button><button class="node" data-k="skills"><i>✦</i>SKILLS</button><button class="node" data-k="apps"><i>▦</i>APPS</button><button class="node" data-k="people"><i>☺</i>PEOPLE</button><button class="node" data-k="remind"><i>◷</i>REMIND</button><button class="node" data-k="live"><i>◉</i>LIVE</button><button class="node" data-k="monitor"><i>◐</i>MONITOR</button><button class="node" data-k="settings"><i>✱</i>SETTINGS</button></div>
 <div id="cap"></div>
 <div id="hud"><div id="status">STANDBY</div><canvas id="wv" width="220" height="28"></canvas><div id="acts"><button id="vm">◉ VOICE MODE</button><button id="term">TERMINATE</button></div></div>
</div>
<div class="card" id="chat"><h3>Conversation</h3><div id="log"></div><div id="chips"></div>
 <div id="bar"><input id="inp" placeholder="Type to JARVIS..." autocomplete="off"><button class="btn" id="mic">🎤</button><button class="btn" id="send">➤</button></div></div>
<div class="card" id="panel"><button id="pclose">✕</button><div id="pbody"></div></div>
<div id="livebox" style="display:none"><h3>Global map</h3><canvas id="map"></canvas><h3>Agent office</h3><canvas id="off"></canvas><h3>System feed</h3><div id="feed"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const S=Object.assign({mem:[],hist:[],voice:true,wake:false,rate:1,pitch:1,acc:"#9e1b32",lang:"en-IN",vname:"",api:"",apps:[],contacts:[],rem:[],web:true,cc:"91"},LS("jv2")||{});S.wake=false;if(S.acc==="#19e6c1"||S.acc==="#9e1b32")S.acc="#9e1b32";
const save=()=>LS("jv2",{mem:S.mem,hist:S.hist.slice(-40),voice:S.voice,rate:S.rate,pitch:S.pitch,acc:S.acc,lang:S.lang,vname:S.vname,api:S.api,apps:S.apps,contacts:S.contacts,rem:S.rem,web:S.web,cc:S.cc});
const API=()=>S.api||(location.protocol.startsWith("http")?location.origin:"http://localhost:5000");
let vm=false,wl=null,CX=0,CY=0,tlt=.4,drag=false,lx=0,ly=0,rgb=[201,164,92],mode="idle",busy=false,speaking=false,msgs=0,online=null,lats=[],memT=0,cur="memory",t0=Date.now(),speed=.004;
function accent(h){S.acc=h;document.documentElement.style.setProperty("--acc",h);rgb=[1,3,5].map(i=>parseInt(h.substr(i,2),16))}accent(S.acc);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
function setMode(m,label){mode=m;$("#status").textContent=label||m.toUpperCase();speed={idle:.004,listen:.015,think:.025,speak:.03}[m]}
function log(t){const d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+t;$("#feed").prepend(d);if($("#feed").children.length>60)$("#feed").lastChild.remove()}

/* ORB + WAVE */
const cv=$("#cv"),cx=cv.getContext("2d"),wv=$("#wv"),wx=wv.getContext("2d");let W,H,pts=[],rot=0;
function rs(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio}
for(let i=0;i<500;i++){const a=Math.acos(2*Math.random()-1),b=Math.random()*6.283;pts.push([Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)])}
rs();
const D2R=Math.PI/180;
function sp3(lat,lon,r,ry,tl){const cl=Math.cos(lat),x=cl*Math.sin(lon),y=Math.sin(lat),z=cl*Math.cos(lon);
 const x1=x*Math.cos(ry)+z*Math.sin(ry),z1=-x*Math.sin(ry)+z*Math.cos(ry);return[x1*r,(y*Math.cos(tl)-z1*Math.sin(tl))*r,(y*Math.sin(tl)+z1*Math.cos(tl))*r]}
function rp(r,a,b,t){const x=Math.cos(t)*r,y=Math.sin(t)*r,y1=y*Math.cos(a),z1=y*Math.sin(a);return[x*Math.cos(b)-y1*Math.sin(b),x*Math.sin(b)+y1*Math.cos(b),z1]}
function seg(a,b,col,aF,aB,w){cx.strokeStyle="rgba("+col+","+((a[2]+b[2])>=0?aF:aB)+")";cx.lineWidth=w;cx.beginPath();cx.moveTo(CX+a[0],CY-a[1]);cx.lineTo(CX+b[0],CY-b[1]);cx.stroke()}
const RINGS=[[1.34,1.15,.25],[1.52,-.5,1.1],[1.2,.35,2.4]];
function drawRings(front,R,col,dp,cxm,cym,T,lvl){RINGS.forEach((rg,k)=>{const r=rg[0]*R,b0=rg[2]+rot*.15*(k+1);let pv=null;
 for(let j=0;j<=100;j++){const p=rp(r,rg[1],b0,j/100*6.283);if(pv&&(((pv[2]+p[2])>=0)===front))seg(pv,p,col,front?.95:.3,.3,(k?1.2:1.8)*dp);pv=p}
 const d=rp(r,rg[1],b0,T/(2200-k*300)*(k%2?-1:1)*(1+lvl*1.6)+k*2);if((d[2]>=0)===front){cx.fillStyle="rgb("+col+")";cx.beginPath();cx.arc(cxm+d[0],cym-d[1],(3.6+lvl*2)*dp*(front?1:.7),0,6.283);cx.fill()}})}
cv.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor="grabbing";if($("#panel").classList.contains("open"))closePanel();try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener("pointermove",e=>{if(!drag)return;rot+=(e.clientX-lx)*.01;tlt=Math.max(-.2,Math.min(.9,tlt+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>{drag=false;cv.style.cursor="grab"}));
(function draw(){const T=Date.now(),lvl=mode==="idle"?0:.5+.5*Math.sin(T/(mode==="think"?110:190)),dp=devicePixelRatio;if(!drag)rot+=speed*.5;cx.clearRect(0,0,W,H);
 const desk=innerWidth>900&&!vm,col=rgb.join(","),tl=tlt,R=vm?Math.min(W,H)*.25:desk?Math.min(W-560*dp,H)*.25:Math.min(W,H)*.19,
  bob=Math.sin(T/900)*5*dp,cxm=vm?W/2:desk?W/2-105*dp:W/2,cym=(vm?H/2:desk?H/2-20*dp:H*.28)+bob;CX=cxm;CY=cym;
 const g=cx.createRadialGradient(cxm,cym,R*.5,cxm,cym,R*2.2);g.addColorStop(0,"rgba("+col+","+(.14+.14*lvl)+")");g.addColorStop(1,"rgba("+col+",0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.save();cx.translate(cxm,cym+R*1.62-bob*.6);cx.scale(1,.16);const sg=cx.createRadialGradient(0,0,0,0,0,R*1.25);sg.addColorStop(0,"rgba(110,25,40,.35)");sg.addColorStop(1,"rgba(110,25,40,0)");cx.fillStyle=sg;cx.beginPath();cx.arc(0,0,R*1.25,0,6.283);cx.fill();cx.restore();
 drawRings(false,R,col,dp,cxm,cym,T,lvl);
 const bd=cx.createRadialGradient(cxm-R*.38,cym-R*.42,R*.05,cxm,cym,R*1.02);bd.addColorStop(0,"#fffaf0");bd.addColorStop(.55,"#f6dcb8");bd.addColorStop(1,"#d9a97a");
 cx.fillStyle=bd;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.fill();
 for(let la=-72;la<=72;la+=6)for(let lo=0;lo<360;lo+=6){const n=Math.sin(la*.09+1.3)*Math.cos(lo*.06)+Math.sin(lo*.11+la*.05)*.8;if(n<.55)continue;const p=sp3(la*D2R,lo*D2R,R,rot,tl);if(p[2]<=0)continue;cx.fillStyle="rgba("+col+","+(.18+.5*p[2]/R)+")";const z=1.6*dp*(.5+p[2]/R);cx.fillRect(cxm+p[0]-z/2,cym-p[1]-z/2,z,z)}
 for(let i=0;i<12;i++){let pv=null;for(let j=0;j<=48;j++){const p=sp3((-90+j*3.75)*D2R,i*30*D2R,R,rot,tl);if(pv)seg(pv,p,col,.4,.08,dp);pv=p}}
 for(const la of[-60,-30,0,30,60]){let pv=null;for(let j=0;j<=64;j++){const p=sp3(la*D2R,j*5.625*D2R,R,rot,tl);if(pv)seg(pv,p,col,la?.35:.8,.08,la?dp:1.4*dp);pv=p}}
 const sp=cx.createRadialGradient(cxm-R*.4,cym-R*.45,0,cxm-R*.4,cym-R*.45,R*.7);sp.addColorStop(0,"rgba(255,255,255,.55)");sp.addColorStop(1,"rgba(255,255,255,0)");cx.fillStyle=sp;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.fill();
 const rm=cx.createRadialGradient(cxm,cym,R*.72,cxm,cym,R);rm.addColorStop(0,"rgba(158,27,50,0)");rm.addColorStop(1,"rgba(158,27,50,.28)");cx.fillStyle=rm;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.fill();
 cx.strokeStyle="rgba("+col+",.9)";cx.lineWidth=1.8*dp;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.stroke();
 drawRings(true,R,col,dp,cxm,cym,T,lvl);
 wx.clearRect(0,0,220,28);wx.fillStyle="rgb("+col+")";for(let i=0;i<32;i++){const h=2+(mode==="idle"?1:lvl*22*Math.abs(Math.sin(i*1.7+T/90)));wx.fillRect(i*7,14-h/2,3,h)}
 requestAnimationFrame(draw)})();

/* NODE LINES */
function lines(){const b=$("#orbbox").getBoundingClientRect(),R=Math.min(b.width,b.height)*.25*1.6,X=b.width/2,Y=b.height/2-10;let d="";
 $$(".node").forEach((n,i)=>{const r=n.getBoundingClientRect(),x=r.right-b.left,y=r.top+r.height/2-b.top;
  d+='<path class="'+(n.dataset.k===cur?"on":"")+'" d="M'+x+' '+y+' H'+(x+22+i*14)+' V'+(Y+(i-($$('.node').length-1)/2)*14)+' H'+(X-R)+'"/>'});$("#lines").innerHTML=d}
addEventListener("resize",()=>{rs();lines()});rs();setTimeout(lines,60);

/* MAP + OFFICE */
const mp=$("#map"),mx=mp.getContext("2d"),spots=[],rip=[];for(let i=0;i<16;i++)spots.push([Math.random(),Math.random()]);
setInterval(()=>{if(!mp.clientWidth)return;mp.width=mp.clientWidth;mp.height=mp.clientHeight;const t=Date.now()/400;
 mx.fillStyle="#d4b38a";for(let x=6;x<mp.width;x+=8)for(let y=6;y<mp.height;y+=8)if(Math.sin(x*.07)+Math.cos(y*.11)+Math.sin((x+y)*.05)>.3)mx.fillRect(x,y,3,3);
 spots.forEach((p,i)=>{mx.fillStyle=i%3?"#9e1b32":"#b8860b";mx.globalAlpha=.4+.6*Math.abs(Math.sin(t+i));mx.fillRect(p[0]*mp.width,p[1]*mp.height,4,4)});mx.globalAlpha=1;
 rip.forEach(r=>{r.r+=2;mx.strokeStyle="rgba("+rgb+","+Math.max(0,1-r.r/60)+")";mx.beginPath();mx.arc(r.x*mp.width,r.y*mp.height,r.r,0,6.283);mx.stroke()});while(rip.length&&rip[0].r>60)rip.shift()},60);
const oc=$("#off"),ox=oc.getContext("2d");oc.width=160;oc.height=64;
const ag=[{c:"#9e1b32",d:[10,12],x:30,y:40},{c:"#3a1a14",d:[50,8],x:60,y:40},{c:"#b8860b",d:[90,12],x:100,y:40},{c:"#2f5d4a",d:[125,10],x:130,y:40}];
setInterval(()=>{ox.fillStyle="#ecd2ac";ox.fillRect(0,0,160,64);ox.fillStyle="#d3b088";for(let x=0;x<160;x+=16)ox.fillRect(x,0,1,64);
 ag.forEach((a,i)=>{const on=(mode==="listen"&&i==0)||(mode==="think"&&i==1)||(mode==="speak"&&i==2)||(Date.now()<memT&&i==3);
  ox.fillStyle="#5a4630";ox.fillRect(a.d[0],a.d[1],22,8);ox.fillStyle=on?"#fff1de":"#9e1b3277";ox.fillRect(a.d[0]+9,a.d[1]+1,4,3);
  const tx=on?a.d[0]+9:a.x+Math.random()*10-5,ty=on?a.d[1]+11:Math.max(24,Math.min(58,a.y+Math.random()*10-5));
  a.x+=Math.sign(tx-a.x)*Math.min(3,Math.abs(tx-a.x));a.y+=Math.sign(ty-a.y)*Math.min(3,Math.abs(ty-a.y));

 b.style.marginLeft="6px";b.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));b.download="reminder.ics";b.textContent="Download .ics";d.append(a,b);$("#log").appendChild(d);$("#log").scrollTop=1e9}

 const what=w.rest.replace(/remind me|set (?:a )?reminder|\breminder\b|\b(?:today|tonight|tomorrow|day after tomorrow)\b|\bat\b/g," ").replace(/\s+/g," ").trim().replace(/^(to|about|that)\s+/,"").replace(/\s+(to|about)$/,"")||"reminder";
 const r={id:Date.now(),t:w.d.getTime(),w:what,done:false};S.rem.push(r);save();panel();calLinks(r);
 if(window.Notification&&Notification.permission==="default")try{Notification.requestPermission()}catch(e){}
 return"Reminder set for "+w.d.toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})+": "+what+". I'll alert you while this page is open. Tap Save to calendar for a phone alert even after you close it."}
function fireRem(){const n=Date.now();S.rem.filter(r=>!r.done&&r.t<=n).forEach(r=>{r.done=true;const t="Reminder: "+r.w;bubble("a","⏰ "+t);speak(t,true);log(t);
 try{if(Notification.permission==="granted")new Notification("JARVIS",{body:r.w})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}save();if(cur==="remind")panel()});S.rem=S.rem.filter(r=>!r.done||n-r.t<864e5)}
setInterval(fireRem,5000);

/* SKILLS */
async function weather(){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000}));
 const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude+"&current_weather=true"),c=(await r.json()).current_weather;
 return"It is "+c.temperature+"°C with wind at "+c.windspeed+" km/h."}catch(e){return"I couldn't get the weather. Allow location access and try again."}}
function local(q){const l=q.toLowerCase().trim();let m;
 if(/^(clear|reset) chat/.test(l)){clearChat();return"Chat cleared."}
 if(/^(?:remind me|set (?:a )?reminder|reminder)\b/.test(l))return setRem(l);
 if(/^(?:list|show|my) reminders?$/.test(l)){const L=S.rem.filter(r=>!r.done);return L.length?"Upcoming: "+L.map(r=>r.w+" at "+new Date(r.t).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})).join("; "):"No upcoming reminders."}
 if(/^(?:clear|delete) (?:all )?reminders$/.test(l)){S.rem=[];save();panel();return"Reminders cleared."}
 if(/\btime\b/.test(l)&&l.length<30)return"It is "+new Date().toLocaleTimeString()+".";
 if(/\b(date|day)\b/.test(l)&&l.length<30)return"Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
 if(m=l.match(/timer (?:for )?(\d+)\s*(sec|min|hour)/)){const n=+m[1],ms=n*(m[2]==="hour"?3600000:m[2]==="min"?60000:1000);
  setTimeout(()=>{const t="Timer finished: "+n+" "+m[2];bubble("a",t);speak(t);log(t)},ms);return"Timer started: "+n+" "+m[2]+"."}
 if((m=l.match(/^(?:calc(?:ulate)?|what(?:'s| is))?\s*([\d.\s+\-*/()%^x]+)$/))&&/\d\s*[+\-*/x^%]\s*\d/.test(l)){try{const v=Function('"use strict";return ('+m[1].replace(/x/g,"*").replace(/\^/g,"**")+")")();return"= "+(+v.toFixed(6))}catch(e){}}
 if(/weather|temperature/.test(l))return weather();
 if(m=l.match(/^remember (?:that )?(.+)/)){S.mem.push(q.replace(/^remember (that )?/i,""));memT=Date.now()+2500;save();panel();return"Saved to memory."}
 if(/^forget (all|everything)/.test(l)){S.mem=[];save();panel();return"Memory cleared."}
 if(/what do you (remember|know about me)/.test(l))return S.mem.length?"I remember: "+S.mem.join("; "):"My memory is empty.";
 if(m=q.match(/^add app (.+?) (?:package|pkg) ([\w.]+)$/i)){if(!pkgOk(m[2]))return"That package name looks invalid.";S.apps.push({n:m[1].toLowerCase(),p:m[2]});save();panel();return"Added app "+m[1]+"."}
 if(m=q.match(/^add app (.+?) (?:link|url) (\S+)$/i)){if(!urlOk(m[2]))return"That link looks invalid.";S.apps.push({n:m[1].toLowerCase(),u:m[2]});save();panel();return"Added app "+m[1]+"."}
 if(m=q.match(/^call (\+?[\d ]{6,15})$/i))return go("call "+m[1].trim(),"tel:"+m[1].replace(/ /g,""));
 if(m=q.match(/^(?:add|save) contact (.+?) (\+?[\d ]{7,15})$/i)){S.contacts.push({n:m[1].toLowerCase(),t:m[2].trim()});save();panel();return"Saved contact "+m[1]+"."}
 if(m=l.match(/^(?:delete|remove) contact (.+)/)){const k=m[1].trim(),b=S.contacts.length;S.contacts=S.contacts.filter(c=>c.n!==k);save();panel();return S.contacts.length<b?"Removed "+k+".":"No contact named "+k+"."}
 if(m=q.match(/^call (.+)$/i)){const f=findContact(m[1]);if(f)return go("call "+f.c.n,"tel:+"+fullNum(f.c.t))}
 if(m=q.match(/^sms (.+)$/i))return sendMsg("sms",m[1]);
 if(m=q.match(/^(?:send (?:a )?(?:message|msg|text) to |message |msg |whatsapp |wa )(.+)$/i))return sendMsg("wa",m[1]);
 if((m=q.match(/^text (.+)$/i))&&findContact(m[1]))return sendMsg("wa",m[1]);
 if(m=l.match(/^(?:open|launch)\s+(.+)/))return openApp(m[1]);
 if(m=l.match(/^google (?:for )?(.+)/)){window.open("https://www.google.com/search?q="+encodeURIComponent(m[1]),"_blank");return"Searching for "+m[1]+"."}
 if(m=l.match(/^theme (red|brown|gold|green|blue)/)){accent({red:"#9e1b32",brown:"#6b3a2a",gold:"#b8860b",green:"#2f5d4a",blue:"#3d4f73"}[m[1]]);save();panel();return"Theme changed."}
 return null}

/* CHAT */
function bubble(role,text,cls){const d=document.createElement("div");d.className="m "+(role==="u"?"u":"a")+(cls?" "+cls:"");d.innerHTML=md(text);$("#log").appendChild(d);$("#log").scrollTop=1e9;return d}
function clearChat(){S.hist=[];save();$("#log").innerHTML="";log("chat cleared")}
async function ping(){try{const r=await fetch(API()+"/health",{cache:"no-store"});online=r.ok}catch(e){online=false}}
let srcs=[];
const WEBRX=/^(search|look up|find out)\b|\b(latest|news|today|tonight|yesterday|current|currently|score|scores|price|prices|trending|who won|release date|stock|live score|right now|this week|update on)\b|\bwho (is|are) (the )?(current|new)\b/;
function addSrc(el){const L=srcs.filter(x=>/^https?:/.test(x.url));if(!L.length)return;const d=document.createElement("div");d.style.cssText="margin-top:6px;font-size:12px";
 L.forEach((x,i)=>{const a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener";a.textContent=(i+1)+". "+String(x.title||x.url).slice(0,50);a.style.cssText="display:block;color:var(--acc)";d.appendChild(a)});el.appendChild(d)}
async function brain(q){srcs=[];const r=await local(q);if(r)return r;const web=S.web&&WEBRX.test(q.toLowerCase());
 const h=S.hist.slice(-10);while(h.length&&h[0].role!=="user")h.shift();const t=performance.now();if(web)setMode("think","SEARCHING THE WEB");
 try{const res=await fetch(API()+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:h,memory:S.mem,web})});
  const j=await res.json();lats.push(performance.now()-t);if(lats.length>20)lats.shift();online=res.ok;srcs=j.sources||[];return j.text||j.error||"No reply."}
 catch(e){online=false;return"I can't reach my server. Open this page from your Render link, or set the server link in Settings."}}
async function send(text){text=(text||$("#inp").value).trim();if(!text||busy)return;$("#inp").value="";
 bubble("u",text);S.hist.push({role:"user",content:text});busy=true;msgs++;rip.push({x:Math.random(),y:Math.random(),r:0});
 setMode("think","THINKING");const sp=bubble("a","…","typing");log("query: "+text.slice(0,28));
 const ans=await brain(text);sp.classList.remove("typing");sp.innerHTML=md(ans);addSrc(sp);S.hist.push({role:"assistant",content:ans});save();
 busy=false;setMode("idle","STANDBY");if(vm)$("#cap").textContent=ans;speak(ans,vm)}
$("#send").onclick=()=>send();$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("#term").onclick=()=>{if(vm){voiceMode(false);return}if(window.speechSynthesis)speechSynthesis.cancel();if(rec)rec.stop();if(S.wake){wake(false);panel()}setMode("idle","TERMINATED");log("terminated");setTimeout(()=>{if(mode==="idle")setMode("idle","STANDBY")},1500)};
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#panel").classList.contains("open"))closePanel();else $("#term").click()}});
["time","weather","timer 1 minute","calculate 12*8+3","tell me a joke","what do you remember"].forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=()=>send(c);$("#chips").appendChild(b)});

/* PWA + BOOT */
try{const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify({name:"JARVIS",short_name:"JARVIS",display:"standalone",start_url:".",background_color:"#efd2ab",theme_color:"#efd2ab"})],{type:"application/json"}));document.head.appendChild(l)}catch(e){}
S.hist.forEach(h=>bubble(h.role==="user"?"u":"a",h.content));bubble("a","Systems online. Type, tap the mic, or turn on the wake word in Settings.");
{const ms=S.rem.filter(r=>!r.done&&r.t<=Date.now());if(ms.length){ms.forEach(r=>r.done=true);save();bubble("a","⏰ Missed while you were away: "+ms.map(r=>r.w).join("; "))}}
panel("memory",true);ping();setInterval(ping,20000);log("boot complete");
