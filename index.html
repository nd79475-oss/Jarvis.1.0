<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efd2ab"><meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<style>
:root{--bg:#efd2ab;--pn:#ffe4c4;--ln:#c9a37a;--tx:#3a1a14;--dm:#7a5a45;--acc:#9e1b32;--red:#9e1b32}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#fff0dc,var(--bg) 75%);color:var(--tx);font:15px/1.5 Georgia,"Times New Roman",serif;display:grid;grid-template-columns:250px 1fr 370px;gap:12px;padding:12px;overflow:hidden}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:14px;min-height:0;display:flex;flex-direction:column;box-shadow:inset 0 0 0 3px var(--pn),inset 0 0 0 4px #9e1b3233}
h3{margin:0 0 8px;font:600 11px Georgia,serif;letter-spacing:.28em;color:var(--acc);text-transform:uppercase;flex:none}
canvas{display:block}#left{gap:8px;overflow:auto}
#map,#off{width:100%;height:105px;border:1px solid var(--ln);border-radius:4px;flex:none}#off{image-rendering:pixelated;background:#ecd2ac}
#feed{flex:1;overflow:auto;min-height:70px;font-size:12px;color:var(--dm)}#feed div{padding:4px 0;border-bottom:1px solid var(--ln)}
#center{display:grid;grid-template-rows:1fr 240px;gap:12px;min-height:0}
#orbbox{position:relative;padding:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff3e2,#f0d3ab 80%)}#cv{position:absolute;inset:0;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lines path{fill:none;stroke:var(--acc);stroke-width:1;opacity:.35}#lines path.on{opacity:1;stroke-width:1.8}
#nodes{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:9px}
button{font-family:inherit}
.node{border:1px solid var(--acc);color:var(--tx);background:#fff1deee;border-radius:3px;padding:8px 16px;font-size:11px;font-weight:600;letter-spacing:.22em;cursor:pointer;text-align:left;transition:.15s;min-width:118px}
.node:hover{background:#9e1b3233;box-shadow:0 0 12px #9e1b3255}.node:active{transform:scale(.97)}
.node.on{background:var(--acc);color:#fff1de;box-shadow:0 0 16px #9e1b3288}
#term{position:absolute;top:14px;right:14px;border:1px solid var(--red);color:#9e1b32;background:#fff1deee;border-radius:3px;padding:8px 16px;font-size:11px;font-weight:600;letter-spacing:.22em;cursor:pointer;transition:.15s}
#term:hover{background:var(--red);color:#fff;box-shadow:0 0 14px #b0485a88}
#status{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.35em;color:var(--acc)}
#wv{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:220px;height:28px}
#pbody{flex:1;overflow:auto;font-size:14px}#pbody label{display:block;margin:5px 0}
.row{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}.row>span{color:var(--dm);min-width:64px}
select,input[type=text],#sb,#mi{background:#fff3e2;color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:7px;font:inherit;min-width:0;flex:1}
select:focus,#sb:focus,#mi:focus,#inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 8px #9e1b3244}
select option{background:#fff1de}input[type=range]{accent-color:var(--acc)}input[type=checkbox]{accent-color:var(--acc)}
.sm{background:transparent;border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.16em;cursor:pointer;transition:.15s}
.sm:hover{background:var(--acc);color:#fff1de;box-shadow:0 0 12px #9e1b3266}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #0000;cursor:pointer;transition:.15s}.sw:hover{transform:scale(1.15)}.sw.on{border-color:#3a1a14;box-shadow:0 0 8px #0003}
.mem{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.mem b{cursor:pointer;color:var(--red)}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px}
.m{padding:9px 12px;border-radius:4px;max-width:92%;word-wrap:break-word}.u{align-self:flex-end;background:#f6cfa6;border:1px solid #9e1b3266}
.a{align-self:flex-start;background:#fff3e2;border:1px solid var(--ln)}.m code{background:#00000018;padding:1px 5px;border-radius:3px}.typing{opacity:.6;font-style:italic}
#chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 5px;flex:none}
.chip{white-space:nowrap;background:transparent;border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.15s}
.chip:hover{background:var(--acc);color:#fff1de;box-shadow:0 0 10px #9e1b3266}
#bar{display:flex;gap:7px;flex:none}
#inp{flex:1;min-width:0;background:#fff3e2;border:1px solid var(--ln);color:var(--tx);border-radius:3px;padding:11px;font:inherit}
.btn{background:var(--acc);color:#fff1de;border:1px solid var(--acc);border-radius:3px;padding:0 15px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 12px #9e1b3288}.btn:active{transform:scale(.96)}
#mic.rec{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:900px){body{display:flex;flex-direction:column;overflow:auto;height:auto;min-height:100%}
#center{display:flex;flex-direction:column;flex:none}#orbbox{height:300px;flex:none}#panel{height:250px;flex:none}#chat{height:75vh;flex:none}#left{flex:none;height:auto;order:3}}
</style></head><body>
<div class="card" id="left"><h3>Global map</h3><canvas id="map"></canvas><h3>Agent office</h3><canvas id="off"></canvas><h3>System feed</h3><div id="feed"></div></div>

<div id="center">
 <div class="card" id="orbbox"><canvas id="cv"></canvas><svg id="lines"></svg>
  <div id="nodes"><button class="node on" data-k="memory">MEMORY</button><button class="node" data-k="skills">SKILLS</button><button class="node" data-k="monitor">MONITOR</button><button class="node" data-k="settings">SETTINGS</button></div>
  <button id="term">TERMINATE</button><div id="status">STANDBY</div><canvas id="wv" width="220" height="28"></canvas></div>
 <div class="card" id="panel"><div id="pbody"></div></div>
</div>

<div class="card" id="chat"><h3>Assistant channel</h3><div id="log"></div><div id="chips"></div>
 <div id="bar"><input id="inp" placeholder="Type to JARVIS..." autocomplete="off"><button class="btn" id="mic">🎤</button><button class="btn" id="send">➤</button></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const S=Object.assign({mem:[],hist:[],voice:true,wake:false,rate:1,pitch:1,acc:"#9e1b32",lang:"en-IN",vname:"",api:""},LS("jv2")||{});S.wake=false;if(S.acc==="#19e6c1"||S.acc==="#9e1b32")S.acc="#9e1b32";
const save=()=>LS("jv2",{mem:S.mem,hist:S.hist.slice(-40),voice:S.voice,rate:S.rate,pitch:S.pitch,acc:S.acc,lang:S.lang,vname:S.vname,api:S.api});
const API=()=>S.api||(location.protocol.startsWith("http")?location.origin:"http://localhost:5000");
let rgb=[201,164,92],mode="idle",busy=false,speaking=false,msgs=0,online=null,lats=[],memT=0,cur="memory",t0=Date.now(),speed=.004;
function accent(h){S.acc=h;document.documentElement.style.setProperty("--acc",h);rgb=[1,3,5].map(i=>parseInt(h.substr(i,2),16))}accent(S.acc);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
function setMode(m,label){mode=m;$("#status").textContent=label||m.toUpperCase();speed={idle:.004,listen:.015,think:.025,speak:.03}[m]}
function log(t){const d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+t;$("#feed").prepend(d);if($("#feed").children.length>60)$("#feed").lastChild.remove()}

/* ORB + WAVE */
const cv=$("#cv"),cx=cv.getContext("2d"),wv=$("#wv"),wx=wv.getContext("2d");let W,H,pts=[],rot=0;
function rs(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio}
for(let i=0;i<500;i++){const a=Math.acos(2*Math.random()-1),b=Math.random()*6.283;pts.push([Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)])}
rs();
const D2R=Math.PI/180;
function sp3(lat,lon,r,ry,tl){const cl=Math.cos(lat),x=cl*Math.sin(lon),y=Math.sin(lat),z=cl*Math.cos(lon);
 const x1=x*Math.cos(ry)+z*Math.sin(ry),z1=-x*Math.sin(ry)+z*Math.cos(ry);return[x1*r,(y*Math.cos(tl)-z1*Math.sin(tl))*r,(y*Math.sin(tl)+z1*Math.cos(tl))*r]}
function rp(r,a,b,t){const x=Math.cos(t)*r,y=Math.sin(t)*r,y1=y*Math.cos(a),z1=y*Math.sin(a);return[x*Math.cos(b)-y1*Math.sin(b),x*Math.sin(b)+y1*Math.cos(b),z1]}
function seg(a,b,col,aF,aB,w){cx.strokeStyle="rgba("+col+","+((a[2]+b[2])>=0?aF:aB)+")";cx.lineWidth=w;cx.beginPath();cx.moveTo(W/2+a[0],H/2-a[1]);cx.lineTo(W/2+b[0],H/2-b[1]);cx.stroke()}
(function draw(){const T=Date.now(),lvl=mode==="idle"?0:.5+.5*Math.sin(T/(mode==="think"?110:190));rot+=speed*.5;cx.clearRect(0,0,W,H);
 const R=Math.min(W,H)*.25,col=rgb.join(","),tl=.4,dp=devicePixelRatio,cxm=W/2,cym=H/2;
 const g=cx.createRadialGradient(cxm,cym,R*.5,cxm,cym,R*2);g.addColorStop(0,"rgba("+col+","+(.10+.12*lvl)+")");g.addColorStop(1,"rgba("+col+",0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const bd=cx.createRadialGradient(cxm-R*.35,cym-R*.35,R*.1,cxm,cym,R);bd.addColorStop(0,"#fff6e8");bd.addColorStop(1,"#e7c79c");
 cx.fillStyle=bd;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.fill();
 for(let i=0;i<12;i++){let pv=null;for(let j=0;j<=48;j++){const p=sp3((-90+j*3.75)*D2R,i*30*D2R,R,rot,tl);if(pv)seg(pv,p,col,.6,.16,dp);pv=p}}
 for(const la of[-60,-30,0,30,60]){let pv=null;for(let j=0;j<=64;j++){const p=sp3(la*D2R,j*5.625*D2R,R,rot,tl);if(pv)seg(pv,p,col,la?.5:.9,.16,la?dp:1.5*dp);pv=p}}
 cx.strokeStyle="rgba("+col+",.95)";cx.lineWidth=2*dp;cx.beginPath();cx.arc(cxm,cym,R,0,6.283);cx.stroke();
 [[1.34,1.15,.25],[1.52,-.5,1.1],[1.2,.35,2.4]].forEach((rg,k)=>{const r=rg[0]*R;let pv=null;
  for(let j=0;j<=100;j++){const p=rp(r,rg[1],rg[2]+rot*.15*(k+1),j/100*6.283);if(pv)seg(pv,p,col,.9,.2,(k?1:1.6)*dp);pv=p}
  const d=rp(r,rg[1],rg[2]+rot*.15*(k+1),T/(2200-k*300)*(k%2?-1:1)*(1+lvl*1.6)+k*2);cx.fillStyle=d[2]>=0?"rgb("+col+")":"rgba("+col+",.35)";cx.beginPath();cx.arc(cxm+d[0],cym-d[1],(3.4+lvl*2)*dp,0,6.283);cx.fill()});
 wx.clearRect(0,0,220,28);wx.fillStyle="rgb("+col+")";for(let i=0;i<32;i++){const h=2+(mode==="idle"?1:lvl*22*Math.abs(Math.sin(i*1.7+T/90)));wx.fillRect(i*7,14-h/2,3,h)}
 requestAnimationFrame(draw)})();

/* NODE LINES */
function lines(){const b=$("#orbbox").getBoundingClientRect(),R=Math.min(b.width,b.height)*.25*1.6,X=b.width/2,Y=b.height/2-10;let d="";
 $$(".node").forEach((n,i)=>{const r=n.getBoundingClientRect(),x=r.right-b.left,y=r.top+r.height/2-b.top;
  d+='<path class="'+(n.dataset.k===cur?"on":"")+'" d="M'+x+' '+y+' H'+(x+22+i*14)+' V'+(Y+(i-1.5)*14)+' H'+(X-R)+'"/>'});$("#lines").innerHTML=d}
addEventListener("resize",()=>{rs();lines()});rs();setTimeout(lines,60);

/* MAP + OFFICE */
const mp=$("#map"),mx=mp.getContext("2d"),spots=[],rip=[];for(let i=0;i<16;i++)spots.push([Math.random(),Math.random()]);
setInterval(()=>{if(!mp.clientWidth)return;mp.width=mp.clientWidth;mp.height=mp.clientHeight;const t=Date.now()/400;
 mx.fillStyle="#d4b38a";for(let x=6;x<mp.width;x+=8)for(let y=6;y<mp.height;y+=8)if(Math.sin(x*.07)+Math.cos(y*.11)+Math.sin((x+y)*.05)>.3)mx.fillRect(x,y,3,3);
 spots.forEach((p,i)=>{mx.fillStyle=i%3?"#9e1b32":"#b8860b";mx.globalAlpha=.4+.6*Math.abs(Math.sin(t+i));mx.fillRect(p[0]*mp.width,p[1]*mp.height,4,4)});mx.globalAlpha=1;
 rip.forEach(r=>{r.r+=2;mx.strokeStyle="rgba("+rgb+","+Math.max(0,1-r.r/60)+")";mx.beginPath();mx.arc(r.x*mp.width,r.y*mp.height,r.r,0,6.283);mx.stroke()});while(rip.length&&rip[0].r>60)rip.shift()},60);
const oc=$("#off"),ox=oc.getContext("2d");oc.width=160;oc.height=64;
const ag=[{c:"#9e1b32",d:[10,12],x:30,y:40},{c:"#3a1a14",d:[50,8],x:60,y:40},{c:"#b8860b",d:[90,12],x:100,y:40},{c:"#2f5d4a",d:[125,10],x:130,y:40}];
setInterval(()=>{ox.fillStyle="#ecd2ac";ox.fillRect(0,0,160,64);ox.fillStyle="#d3b088";for(let x=0;x<160;x+=16)ox.fillRect(x,0,1,64);
 ag.forEach((a,i)=>{const on=(mode==="listen"&&i==0)||(mode==="think"&&i==1)||(mode==="speak"&&i==2)||(Date.now()<memT&&i==3);
  ox.fillStyle="#5a4630";ox.fillRect(a.d[0],a.d[1],22,8);ox.fillStyle=on?"#fff1de":"#9e1b3277";ox.fillRect(a.d[0]+9,a.d[1]+1,4,3);
  const tx=on?a.d[0]+9:a.x+Math.random()*10-5,ty=on?a.d[1]+11:Math.max(24,Math.min(58,a.y+Math.random()*10-5));
  a.x+=Math.sign(tx-a.x)*Math.min(3,Math.abs(tx-a.x));a.y+=Math.sign(ty-a.y)*Math.min(3,Math.abs(ty-a.y));
  ox.fillStyle=a.c;ox.fillRect(a.x,a.y,4,6);ox.fillStyle="#fde3c8";ox.fillRect(a.x,a.y-2,4,3)})},300);

/* PANELS */
const SW=["#9e1b32","#6b3a2a","#b8860b","#2f5d4a","#3d4f73"];
function panel(k){cur=k||cur;$$(".node").forEach(n=>n.classList.toggle("on",n.dataset.k===cur));lines();const p=$("#pbody");
 if(cur==="memory"){p.innerHTML='<h3>Memory</h3>'+(S.mem.length?S.mem.map((m,i)=>'<div class="mem"><span>'+esc(m)+'</span><b data-i="'+i+'">✕</b></div>').join(""):'<div style="color:var(--dm)">Empty. Say: remember that I like cricket</div>')+'<div class="row"><input id="mi" placeholder="Add a memory..."><button class="sm" id="ma">ADD</button></div>';
  p.querySelectorAll("b").forEach(b=>b.onclick=()=>{S.mem.splice(+b.dataset.i,1);save();panel()});
  $("#ma").onclick=()=>{const v=$("#mi").value.trim();if(v){S.mem.push(v);memT=Date.now()+2500;save();panel()}}}
 if(cur==="skills")p.innerHTML='<h3>Skills</h3>• <b>time</b> / <b>date</b><br>• <b>weather</b> (allow location)<br>• <b>timer 5 minutes</b><br>• <b>calculate 12*8+3</b><br>• <b>remember …</b> / <b>what do you remember</b> / <b>forget all</b><br>• <b>open youtube / google / maps / whatsapp</b><br>• <b>search for …</b><br>• <b>theme red / brown / gold / green / blue</b><br>• <b>clear chat</b><br>• anything else → AI brain<br>• Wake word: turn on in Settings, then say “Jarvis …”';
 if(cur==="monitor"){const al=lats.length?Math.round(lats.reduce((a,b)=>a+b,0)/lats.length):0,u=Math.floor((Date.now()-t0)/1000);
  p.innerHTML='<h3>Monitor</h3><div class="row"><span>Backend</span>'+(online===null?"checking…":online?'<b style="color:#2f7a4f">ONLINE</b>':'<b style="color:var(--red)">OFFLINE</b>')+'</div><div class="row"><span>Latency</span>'+al+' ms avg</div><div class="row"><span>Messages</span>'+msgs+'</div><div class="row"><span>Memory</span>'+S.mem.length+' items</div><div class="row"><span>Uptime</span>'+Math.floor(u/60)+"m "+u%60+'s</div><div class="row"><span>Voice in</span>'+(SR?"supported":"needs Chrome")+'</div><div class="row"><span>Server</span>'+esc(API())+'</div>'}
 if(cur==="settings")settingsUI(p)}
function fillVoices(){const s=$("#vs");if(!s||!window.speechSynthesis)return;s.innerHTML='<option value="">Default</option>'+speechSynthesis.getVoices().map(v=>'<option value="'+esc(v.name)+'"'+(v.name===S.vname?" selected":"")+'>'+esc(v.name)+" ("+v.lang+")</option>").join("")}
function settingsUI(p){p.innerHTML='<h3>Settings</h3><label><input type="checkbox" id="sv" '+(S.voice?"checked":"")+'> Speak replies</label><label><input type="checkbox" id="sw" '+(S.wake?"checked":"")+'> Wake word “Jarvis”</label>'+
 '<div class="row"><span>Voice</span><select id="vs"></select></div><div class="row"><span>Speed</span><input type="range" id="sr" min=".6" max="1.6" step=".1" value="'+S.rate+'"><span style="min-width:0">Pitch</span><input type="range" id="sp" min=".5" max="1.5" step=".1" value="'+S.pitch+'"></div>'+
 '<div class="row"><span>Language</span><select id="sl">'+[["en-IN","English (India)"],["en-US","English (US)"],["en-GB","English (UK)"],["hi-IN","Hindi"]].map(l=>'<option value="'+l[0]+'"'+(l[0]===S.lang?" selected":"")+">"+l[1]+"</option>").join("")+'</select></div>'+
 '<div class="row"><span>Color</span>'+SW.map(c=>'<div class="sw'+(c===S.acc?" on":"")+'" data-c="'+c+'" style="background:'+c+'"></div>').join("")+'</div>'+
 '<div class="row"><span>Server</span><input id="sb" placeholder="same server (default)" value="'+esc(S.api)+'"></div><div class="row"><button class="sm" id="tv">TEST VOICE</button><button class="sm" id="ex">EXPORT CHAT</button><button class="sm" id="cl">CLEAR CHAT</button></div>';
 fillVoices();$("#sv").onchange=e=>{S.voice=e.target.checked;save()};$("#sw").onchange=e=>wake(e.target.checked);
 $("#vs").onchange=e=>{S.vname=e.target.value;save()};$("#sr").oninput=e=>{S.rate=+e.target.value;save()};$("#sp").oninput=e=>{S.pitch=+e.target.value;save()};
 $("#sl").onchange=e=>{S.lang=e.target.value;save()};p.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{accent(s.dataset.c);save();panel()});
 $("#sb").onchange=e=>{S.api=e.target.value.trim().replace(/\/$/,"");save();ping();log("server saved")};
 $("#tv").onclick=()=>speak("Voice test. All systems online.",true);$("#cl").onclick=clearChat;
 $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([S.hist.map(h=>(h.role==="user"?"YOU: ":"JARVIS: ")+h.content).join("\n\n")],{type:"text/plain"}));a.download="jarvis-chat.txt";a.click()}}
$$(".node").forEach(n=>n.onclick=()=>panel(n.dataset.k));
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;
setInterval(()=>{if(cur==="monitor")panel()},2000);

/* VOICE OUT */
function speak(t,force){if((!S.voice&&!force)||!window.speechSynthesis)return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replace(/[*`#]/g,""));u.rate=S.rate;u.pitch=S.pitch;u.lang=S.lang;
 const v=speechSynthesis.getVoices().find(v=>v.name===S.vname);if(v)u.voice=v;
 u.onstart=()=>{speaking=true;setMode("speak","SPEAKING")};u.onend=u.onerror=()=>{speaking=false;if(!busy)setMode("idle","STANDBY")};speechSynthesis.speak(u)}

/* VOICE IN */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,wk=null,awaiting=false;
$("#mic").onclick=()=>{if(!SR)return bubble("a","Voice input needs Chrome.");if(rec){rec.stop();return}
 rec=new SR();rec.lang=S.lang;rec.onstart=()=>{$("#mic").classList.add("rec");setMode("listen","LISTENING")};
 rec.onresult=e=>send(e.results[0][0].transcript);
 rec.onend=()=>{rec=null;$("#mic").classList.remove("rec");if(!busy&&!speaking)setMode("idle","STANDBY")};rec.start()};
function wake(on){S.wake=on;if(!on){if(wk){wk.onend=null;wk.stop();wk=null}log("wake word off");return}
 if(!SR){S.wake=false;panel();return bubble("a","Wake word needs Chrome.")}
 const run=()=>{if(!S.wake)return;wk=new SR();wk.lang=S.lang;wk.continuous=true;
  wk.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim(),l=t.toLowerCase();if(speaking||busy||!t)return;
